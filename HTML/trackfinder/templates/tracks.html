<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name + " 2026" }}</title>
</head>
<body>
    <nav> 

    <a href="{{ url_for('home') }}">Home</a> | 

    <a href="{{ url_for('tracks_page') }}">Tracks</a> 

    </nav>

    <div id="tracks">

    {% for track in tracks %} 

        <p>{{ track.name }}, it is {{ track.length }}km long</p>

        <p>
        {% for i in range(track.stars) %}
            ★
        {% endfor %}
        </p>

        <img src="{{ track.image }}" alt="{{ track.name }}" width="200">

    {% endfor %}

    </div>
</body>
</html>
