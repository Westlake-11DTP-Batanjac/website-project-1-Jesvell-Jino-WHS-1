<!DOCTYPE html> 

<html> 

<head> 

    <title>{{ site_name.upper() }}</title> 

</head> 

<body> 
    <nav> 

    <a href="{{ url_for('home') }}">Home</a> | 

    <a href="{{ url_for('tracks_page') }}">Tracks</a> 

    </nav>
    
    <h1>Track Finder</h1> 

    <p>Walking tracks around Auckland.</p>
    
    <p>There are about {{ count }} tracks in Auckland.</p>
        {% if count > 3 %} 

            <p>Plenty to choose from.</p> 

        {% elif count == 0 %}

            <p>There are no tracks sadly!</p>

        {% else %}

            <p>Only a few for now.</p> 

        {% endif %}

        <p>{{ message }}</p>

</body> 

</html>
